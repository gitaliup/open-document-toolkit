[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-document-toolkit"
version = "0.1.0"
description = "An open-source toolkit for creating, editing, and managing PDF documents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name"}
]
dependencies = [
    "pypdf>=5.0.0"
]

[project.scripts]
odt = "odt.pdf:main"

[tool.setuptools.packages.find]
where = ["src"]
